[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kinema"
version = "0.2.0"
description = "Monocular video to joint-angle metrics, an annotated video and a PDF report."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Muhammad Naufal Azzahri" }]
requires-python = ">=3.11"
keywords = ["pose-estimation", "mediapipe", "biomechanics", "opencv", "motion-analysis"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    "mediapipe>=0.10.0,<2",
    # mediapipe pulls the contrib build, so declare it directly rather than
    # opencv-python: installing both leaves two packages providing cv2.
    "opencv-contrib-python>=4.8,<6",
    "numpy>=1.24,<3",
    "fastapi>=0.100,<1",
    "python-multipart>=0.0.9,<1",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.4,<3",
    "uvicorn>=0.23,<1",
    "pandas>=2.0,<3",
    "matplotlib>=3.7,<4",
    "fpdf2>=2.7,<3",
    "pillow>=13.0,<14",
]

[project.optional-dependencies]
dev = [
    # 9.0.3 is the first release without PYSEC-2026-1845.
    "pytest>=9.0.3,<10",
    "pytest-cov>=5,<7",
    "httpx>=0.27,<1",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
    "pip-audit>=2.7,<3",
]

[project.scripts]
kinema = "kinema.run:main"

[project.urls]
Repository = "https://github.com/Zahrexxs/Kinema"

[tool.setuptools.packages.find]
include = ["kinema*"]

[tool.setuptools.package-data]
"kinema.api" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency injection relies on callables as defaults.
"kinema/api/main.py" = ["B008"]

[tool.mypy]
# numpy's bundled stubs use PEP 695 syntax, which mypy only parses for >=3.12.
python_version = "3.12"
ignore_missing_imports = true

[tool.coverage.run]
source = ["kinema"]
omit = ["kinema/api/static/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
