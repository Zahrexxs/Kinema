name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system libraries
        # opencv-contrib-python needs libGL/libEGL/libglib (OpenCV 5 links EGL).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libglib2.0-0 libegl1 libgles2 libportaudio2

      - name: Start audio server
        # mediapipe imports sounddevice, which initialises PortAudio at import
        # time. Without a reachable server Pa_Initialize raises and the import
        # fails, even though we never touch audio.
        run: |
          sudo apt-get install -y --no-install-recommends pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl info

      - name: Install dependencies
        # Ranges, not the lock: the lock is generated on 3.12 and would pin
        # packages that do not exist for 3.11.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest --cov=kinema --cov-report=term-missing --cov-fail-under=85

  test:
    # Branch protection requires a check named exactly "test"; matrix jobs get a
    # per-version suffix, so this job reports the aggregate result under that name.
    name: test
    needs: tests
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Check matrix result
        run: |
          echo "matrix result: ${{ needs.tests.result }}"
          test "${{ needs.tests.result }}" = "success"

  quality:
    name: lint, types and audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        # This job also proves the pinned lock file is installable.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install --no-deps -e .

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check
        run: mypy kinema

      - name: Audit dependencies
        run: pip-audit -r requirements.lock
